name: TEST - Stable discovery and paired prerelease
on:
  schedule:
    - cron: '41 5,17 * * *'
  workflow_dispatch:
    inputs:
      upstream_ref:
        description: 'Official stable release tag; empty means latest stable'
        type: string
        default: ''
      force_rebuild:
        description: 'Rebuild artifacts only if this revision is already published; never overwrite'
        type: boolean
        default: false
      simulate_failure:
        description: 'Safe synthetic patch failure; must block builds and publishing'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: stable-test-release
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-22.04
    outputs:
      sha: ${{ steps.upstream.outputs.upstream_sha }}
      tag: ${{ steps.upstream.outputs.upstream_tag }}
      build_needed: ${{ steps.upstream.outputs.build_needed }}
      publish_needed: ${{ steps.upstream.outputs.publish_needed }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_REF: ${{ inputs.upstream_ref }}
          FORCE_REBUILD: ${{ inputs.force_rebuild }}
          SIMULATE_FAILURE: ${{ inputs.simulate_failure }}
        run: |
          args=()
          [[ "$FORCE_REBUILD" != true ]] || args+=(--force)
          [[ "$SIMULATE_FAILURE" != true ]] || args+=(--simulate-failure)
          python3 scripts/upstream.py stable --ref "$REQUESTED_REF" "${args[@]}"
      - name: Discovery and deduplication report
        if: always()
        run: |
          if [[ -f .work/discovery.json ]]; then
            { echo '## Stable discovery'; echo '```json'; cat .work/discovery.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: stable-discovery-${{ github.run_id }}
          path: .work/discovery.json
          if-no-files-found: warn
  build:
    needs: discover
    if: needs.discover.outputs.build_needed == 'true'
    uses: ./.github/workflows/test-build.yml
    with:
      upstream_ref: ${{ needs.discover.outputs.sha }}
      upstream_tag: ${{ needs.discover.outputs.tag }}
      variant: both
      simulate_failure: ${{ inputs.simulate_failure || false }}
  prerelease:
    needs: [discover, build]
    if: needs.discover.outputs.publish_needed == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      UPSTREAM_EXPECTED_SHA: ${{ needs.discover.outputs.sha }}
      UPSTREAM_TAG: ${{ needs.discover.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: rustdesk-*-test-windows-x86_64
          path: .work/collected
          merge-multiple: false
      - name: BOTH variants, provenance, checksums and architecture must pass
        run: python3 scripts/release.py collect .work/collected
      - name: Stage both drafts then expose test prereleases
        run: python3 scripts/release.py publish .work/collected
